services:
  # 1. Web Server & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: web_gateway_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - nodered
      - mariadb
    networks:
      - app_network

  # 2. Backend Low-Code API Microservice
  nodered:
    image: nodered/node-red:latest
    container_name: backend_nodered
    restart: always
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
    depends_on:
      - mariadb
    networks:
      - app_network

  # 3. Relational Database Server
  mariadb:
    image: mariadb:latest
    container_name: database_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_app
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app_network

  # 4. Database Web Management Interface
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: admin_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - mariadb
    networks:
      - app_network

  # 5. Cloudflare Zero-Trust Secure Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tunnel_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token YOUR_CLOUDFLARE_TUNNEL_TOKEN
    networks:
      - app_network

volumes:
  mariadb_data:
    driver: local

networks:
  app_network:
    driver: bridge
