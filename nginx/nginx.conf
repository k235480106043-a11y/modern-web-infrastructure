# =========================================================
# WEBSITE 1: CỔNG THÔNG TIN QUẢN TRỊ & GỌI API (PORTAL)
# =========================================================
server {
    listen 80;
    # Hỗ trợ cả tên miền Cloudflare và truy cập kiểm thử bằng localhost
    server_name ngoclinh1.tnut.cuong.id.vn localhost "";

    # 1. Định tuyến giao diện tĩnh Website 1
    location / {
        root /usr/share/nginx/html/web1;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy chuyển tiếp yêu cầu API sang Node-RED backend
    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =========================================================
# WEBSITE 2: TRANG GIỚI THIỆU ĐỘC LẬP (VIRTUAL HOST 2)
# =========================================================
server {
    listen 80;
    # Tên miền thứ hai độc lập
    server_name ngoclinh2.tnut.cuong.id.vn web2.localhost;

    # 1. Định tuyến giao diện tĩnh Website 2
    location / {
        root /usr/share/nginx/html/web2;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy API cho Website 2 nếu cần gọi dịch vụ
    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}